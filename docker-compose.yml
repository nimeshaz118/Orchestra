services:
  postgres:
    image: postgres:17-alpine
    container_name: orchestra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: orchestra_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/database/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql:ro
      - ./infrastructure/database/migrations/002_user_avatar.sql:/docker-entrypoint-initdb.d/002_user_avatar.sql:ro
      - ./infrastructure/database/migrations/003_api_stored_procedures.sql:/docker-entrypoint-initdb.d/003_api_stored_procedures.sql:ro
      - ./infrastructure/database/migrations/004_model_creation_procedure.sql:/docker-entrypoint-initdb.d/004_model_creation_procedure.sql:ro
      - ./infrastructure/database/migrations/004_platform_setting_procedures.sql:/docker-entrypoint-initdb.d/004_platform_setting_procedures.sql:ro
      - ./infrastructure/database/migrations/004_provider_read_procedures.sql:/docker-entrypoint-initdb.d/004_provider_read_procedures.sql:ro
      - ./infrastructure/database/migrations/004_routing_policies.sql:/docker-entrypoint-initdb.d/004_routing_policies.sql:ro
      - ./infrastructure/database/migrations/004_super_admin_feature_flags.sql:/docker-entrypoint-initdb.d/004_super_admin_feature_flags.sql:ro
      - ./infrastructure/database/migrations/005_platform_setting_apply_flag.sql:/docker-entrypoint-initdb.d/005_platform_setting_apply_flag.sql:ro
      - ./infrastructure/database/migrations/006_routing_policy_delete.sql:/docker-entrypoint-initdb.d/006_routing_policy_delete.sql:ro
      - ./infrastructure/database/migrations/007_routing_policy_patch_and_deleted_reads.sql:/docker-entrypoint-initdb.d/007_routing_policy_patch_and_deleted_reads.sql:ro
      - ./infrastructure/database/migrations/008_routing_policy_read_shape.sql:/docker-entrypoint-initdb.d/008_routing_policy_read_shape.sql:ro
      - ./infrastructure/database/migrations/009_routing_policy_uniqueness_and_reads.sql:/docker-entrypoint-initdb.d/009_routing_policy_uniqueness_and_reads.sql:ro
      - ./infrastructure/database/migrations/010_routing_policy_delete_feedback.sql:/docker-entrypoint-initdb.d/010_routing_policy_delete_feedback.sql:ro

volumes:
  postgres_data:
