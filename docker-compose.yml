services:
  postgres:
    image: postgres:17-alpine
    container_name: orchestra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: orchestra_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/database/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql:ro

volumes:
  postgres_data:
